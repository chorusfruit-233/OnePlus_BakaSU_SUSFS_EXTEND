name: Build OnePlus 13 ColorOS 17 (Built-in USB WiFi)

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
    inputs:
      make_release:
        description: 'Do you want to create a release?'
        required: true
        type: boolean
        default: false
      ksu_type:
        description: 'Select KSU Type'
        required: true
        type: choice
        options:
          - BakaSU
          - KSU
        default: BakaSU
      ksu_branch_or_hash:
        description: 'KSU branch or commit hash'
        type: string
        default: 'main'
      optimize_level:
        description: "Compiler optimization level"
        required: true
        type: choice
        options: [O2, O3]
        default: O2
      mlgo:
        description: 'Do you want to enable mlgo? [Machine Learning Guided Optimization]'
        required: false
        type: boolean
        default: true
      clean_build:
        description: 'Clean build (no ccache)'
        type: boolean
        default: false
      debug:
        description: 'Enable debug mode: dumping debug related artifacts and show some debug logs'
        required: false
        type: boolean
        default: false
      mirror_toolchains:
        description: 'Do you want to sync toolchains before build? [99% runs not required]'
        required: false
        type: boolean
        default: false
      build_timestamp:
        description: 'Custom kernel build timestamp for uname -a (e.g. "Tue Feb 10 10:01:02 UTC 2026"). Leave empty for current time.'
        type: string
        default: ''
      android15-6_6_susfs_branch_or_commit:
        description: 'Enter SusFS Branch or commit hash for android15-6.6'
        type: string
        default: ''

  workflow_call:
    inputs:
      os_target:
        type: string
        default: cos17
      make_release:
        type: boolean
        default: false
      ksu_type:
        type: string
        default: BakaSU
      ksu_branch_or_hash:
        type: string
        default: 'main'
      optimize_level:
        type: string
        default: O2
      mlgo:
        type: boolean
        default: true
      clean_build:
        type: boolean
        default: false
      debug:
        type: boolean
        default: false
      mirror_toolchains:
        type: boolean
        default: false
      build_timestamp:
        type: string
        default: ''
      android15-6_6_susfs_branch_or_commit:
        type: string
        default: ''

jobs:
  set-op-model:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      device_count: ${{ steps.set-matrix.outputs.count }}
      active_gki_keys: ${{ steps.set-matrix.outputs.active_gki_keys }}
      susfs_hash_android15_6_6:  ${{ steps.set-matrix.outputs.susfs_hash_android15_6_6 }}
      ksu_resolved_hash:    ${{ steps.set-matrix.outputs.ksu_resolved_hash }}
      susfs_base_version: ${{ steps.set-matrix.outputs.susfs_base_version }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_HTTP_TIMEOUT: 600
    steps:
      - name: 📥 Checkout Code (to access configs/)
        uses: actions/checkout@v7.0.1
        with:
          sparse-checkout: |
            configs/cos17/OP13.json
            manifests/cos17/oneplus_13_w.xml
            scripts/build_target.py
          sparse-checkout-cone-mode: false

      - name: 🔍 Generate build matrix
        id: set-matrix
        shell: bash
        env:
          OS_TARGET: ${{ inputs.os_target || 'cos17' }}
        run: |
          set -euo pipefail
          echo "::group::Matrix generation"
          
          ksu_type="${{ inputs.ksu_type }}"
          ksu_hash="${{ inputs.ksu_branch_or_hash }}"
          python3 scripts/build_target.py --target "$OS_TARGET" --root "$GITHUB_WORKSPACE" > matrix.json
          filtered=$(jq -c '.' matrix.json)
          count=$(jq 'length' matrix.json)

          # Inject KSU type and hash into every device config
          merged_matrix=$(jq \
            --arg ksu_type "$ksu_type" \
            --arg ksu_hash "$ksu_hash" \
            '[.[] | . + {ksu_type: $ksu_type, ksu_hash: $ksu_hash}]' \
            <<<"$filtered")
          final_count=$(echo "$merged_matrix" | jq 'length')
          
          echo "✅ Found $final_count device(s) to build"
          echo ""
          echo "Selected devices:"
          jq -r '.[] | "  - \(.model) (\(.os_version), \(.android_version)-\(.kernel_version), \(.ksu_type) - \(.ksu_hash))"' <<<"$merged_matrix"
          
          echo "count=$count" >> "$GITHUB_OUTPUT"
          
          ksu_type="${{ inputs.ksu_type }}"
          ksu_ref="${{ inputs.ksu_branch_or_hash }}"
          
          if [ "$ksu_type" == "BakaSU" ]; then
            KSU_REPO_OWNER="Baka-SU"
            KSU_REPO_NAME="BakaSU"
          else
            KSU_REPO_OWNER="tiann"
            KSU_REPO_NAME="KernelSU"
          fi
          
          HEAD_REF="refs/heads/${ksu_ref}"
          TAG_REF="refs/tags/${ksu_ref}"
          
          QUERY='query($owner: String!, $name: String!, $headRef: String!, $tagRef: String!, $objRef: String!) {
            repository(owner: $owner, name: $name) {
              hb: ref(qualifiedName: $headRef) { t: target { ... on Commit { o: oid } } }
              ht: ref(qualifiedName: $tagRef) { t: target { ... on Commit { o: oid } } }
              ho: object(expression: $objRef) { ... on Commit { o: oid } }
            }
          }'
          
          MAX_RETRIES=3
          RETRY_COUNT=0
          RETRY_DELAY=5 # Seconds to wait between retries
          
          echo "Resolving $ksu_type hash ($ksu_ref)..."
          
          until [ $RETRY_COUNT -ge $MAX_RETRIES ]; do
            RESULT=$(gh api graphql -f query="$QUERY" -f owner="$KSU_REPO_OWNER" -f name="$KSU_REPO_NAME" -f headRef="$HEAD_REF" -f tagRef="$TAG_REF" -f objRef="$ksu_ref" 2>/dev/null)
            EXIT_CODE=$?
            
            if [ $EXIT_CODE -eq 0 ] && [ ! -z "$RESULT" ]; then
              echo "  ✅ API Success"
              break
            fi
            
            RETRY_COUNT=$((RETRY_COUNT + 1))
            echo "::warning::API failed (Attempt $RETRY_COUNT/$MAX_RETRIES). Retrying in ${RETRY_DELAY}s..."
            sleep $RETRY_DELAY
          done
          
          if [ $RETRY_COUNT -eq $MAX_RETRIES ]; then
            echo "::error::GitHub API unreachable. Cannot validate $ksu_ref"
            exit 1
          fi
          
          resolved_sha=$(echo "$RESULT" | jq -r '.data.repository | (.hb.t.o // .ht.t.o // .ho.o // "unknown")')
          
          if [ "$resolved_sha" == "unknown" ]; then
            echo "::error::Ref/Hash '$ksu_ref' does not exist in $KSU_REPO_OWNER/$KSU_REPO_NAME"
            exit 1
          fi
          
          echo "  ✅ Resolved: $ksu_type/$ksu_ref → $resolved_sha"
          echo "ksu_resolved_hash=$resolved_sha" >> "$GITHUB_OUTPUT"
          
          # Inject ksu_resolved_hash into each device in the matrix
          merged_matrix=$(echo "$merged_matrix" | jq  --arg resolved_sha "$resolved_sha" 'map(.ksu_resolved_hash = $resolved_sha)')
          
          # SUSFS hash fetch
          SUSFS_REPO="https://gitlab.com/simonpunk/susfs4ksu.git"
          GITLAB_PROJECT_PATH="simonpunk/susfs4ksu"
          
          declare -A default_branches=(
            ["android15-6.6"]="gki-android15-6.6"
          )
          
          declare -A user_inputs=(
            ["android15-6.6"]="${{ inputs.android15-6_6_susfs_branch_or_commit }}"
          )
          
          mapfile -t active_keys < <(
            echo "$merged_matrix" \
              | jq -r '.[] | select(.susfs == true) | "\(.android_version)-\(.kernel_version)"' \
              | sort -u
          )
          
          echo "🔍 Resolving SUSFS hashes for: ${active_keys[*]:-none}"
          
          declare -A susfs_hashes
          declare -A susfs_versions_per_key
          
          for key in "${active_keys[@]}"; do
            default_val="${default_branches[$key]}"
            user_val="${user_inputs[$key]:-$default_val}"
            
            # Build GraphQL query — include blob fetch only when releasing
            HASH_QUERY="{ project(fullPath: \"${GITLAB_PROJECT_PATH}\") { repository { ch: commit(ref: \"${user_val}\") { sha } } } }"
            RELEASE_QUERY="{ project(fullPath: \"${GITLAB_PROJECT_PATH}\") { repository { ch: commit(ref: \"${user_val}\") { sha } blobs(paths: [\"kernel_patches/include/linux/susfs.h\"], ref: \"${user_val}\") { nodes { rawBlob } } } } }"
            
            if [ "${{ inputs.make_release }}" = "true" ]; then
              GL_QUERY="$RELEASE_QUERY"
            else
              GL_QUERY="$HASH_QUERY"
            fi
            
            MAX_RETRIES=3
            RETRY_COUNT=0
            RETRY_DELAY=5
            resolved=""
            
            until [ $RETRY_COUNT -ge $MAX_RETRIES ]; do
              RESPONSE=$(curl -s --fail -G "https://gitlab.com/api/graphql" --data-urlencode "query=$GL_QUERY")
              EXIT_CODE=$?
              
              if [ $EXIT_CODE -eq 0 ] && [ -n "$RESPONSE" ]; then
                resolved=$(echo "$RESPONSE" | jq -r '.data.project.repository.ch.sha // empty')
                if [ -n "$resolved" ] && [ "$resolved" != "null" ]; then
                  echo "  ✅ Query for $key Success"
                  
                  if [ "${{ inputs.make_release }}" = "true" ]; then
                    extracted=$(echo "$RESPONSE" | jq -r '.data.project.repository.blobs.nodes[0].rawBlob // empty' | grep '#define SUSFS_VERSION' | awk -F'"' '{print $2}')
                    susfs_versions_per_key[$key]="${extracted:-unknown}"
                    echo "  ✅ $key → SUSFS_VERSION = ${extracted:-unknown}"
                  fi
                  
                  break
                fi
              fi
              
              RETRY_COUNT=$((RETRY_COUNT + 1))
              echo "::warning::GitLab GraphQL API failed (Attempt $RETRY_COUNT/$MAX_RETRIES). Retrying..."
              sleep $RETRY_DELAY
            done
            
            # Final Validation — SUSFS hash
            if [ -z "$resolved" ] || [ "$resolved" = "null" ]; then
              echo "::error::Could not resolve SUSFS ref '$user_val' for $key on GitLab."
              exit 1
            fi
            
            # Final Validation — SUSFS version
            if [ "${{ inputs.make_release }}" = "true" ] && [ "${susfs_versions_per_key[$key]:-unknown}" = "unknown" ]; then
              echo "::error::Could not extract SUSFS_VERSION from susfs.h for '$key' after $MAX_RETRIES attempts. Cannot proceed with release."
              exit 1
            fi
            
            susfs_hashes["$key"]="$resolved"
            echo "  ✅ Resolved: $key → $resolved"
          done
          
          # Write CSV list of active GKI versions
          active_gki_keys_csv=$(IFS=','; echo "${active_keys[*]:-}")
          echo "active_gki_keys=$active_gki_keys_csv" >> "$GITHUB_OUTPUT"
          
          # Write hash to GITHUB_OUTPUT
          echo "susfs_hash_android15_6_6=${susfs_hashes[android15-6.6]:-unknown}"   >> "$GITHUB_OUTPUT"
          
          # SUSFS_VERSION — only when releasing
          if [ "${{ inputs.make_release }}" = "true" ]; then
            susfs_base_version="unknown"
            for key in "${active_keys[@]}"; do
              ver="${susfs_versions_per_key[$key]:-unknown}"
              if [ "$ver" != "unknown" ]; then
                susfs_base_version="$ver"
                break
              fi
            done
            
            if [ "$susfs_base_version" = "unknown" ]; then
              echo "::error::Could not extract SUSFS_VERSION from susfs.h for any active GKI key. Cannot proceed with release."
              exit 1
            fi
            
            # make_release=true: mismatch is a hard error — prevents wrong tag
            for key in "${active_keys[@]}"; do
              key_ver="${susfs_versions_per_key[$key]:-unknown}"
              if [ "$key_ver" != "$susfs_base_version" ]; then
                echo "::error::SUSFS version mismatch: '$key' has '$key_ver', expected '$susfs_base_version'. Align refs before releasing."
                exit 1
              fi
            done
            
            echo "susfs_base_version=$susfs_base_version" >> "$GITHUB_OUTPUT"
          fi
          
          # Inject susfs_resolved_hash into each device in the matrix
          susfs_hashes_json=$(jq -n \
            --arg a15 "${susfs_hashes[android15-6.6]:-unknown}" \
            '{
              "android15-6.6":  $a15
            }')
          
          echo "$susfs_hashes_json" > susfs_lookup_temp.json
          merged_matrix=$(echo "$merged_matrix" | jq \
            --slurpfile hashes_array susfs_lookup_temp.json \
            '
              ($hashes_array[0]) as $hashes |
              [.[] | . + {susfs_resolved_hash: ($hashes["\(.android_version)-\(.kernel_version)"] // "unknown")}]
            ')
          
          rm susfs_lookup_temp.json
          
          echo "$merged_matrix" > final_matrix_temp.json
          
          # Recalculate wrapped with updated matrix and write output
          wrapped=$(jq --slurp '{ include: .[] }' final_matrix_temp.json)
          echo "matrix=$(echo "$wrapped" | jq -c .)" >> "$GITHUB_OUTPUT"
          rm final_matrix_temp.json
          
          echo "::endgroup::"

      - name: Upload build matrix
        uses: actions/upload-artifact@v7.0.2
        with:
          name: build-matrix
          path: matrix.json
          archive: false
          retention-days: 7

      - name: 📊 Build plan summary
        run: |
          ksu_type="${{ inputs.ksu_type }}"
          ksu_ref="${{ inputs.ksu_branch_or_hash }}"
          
          ksu_display=""
          if [ "$ksu_type" = "BakaSU" ] || [ "$ksu_type" = "KSU" ]; then
            if [[ "$ksu_ref" =~ ^[0-9a-f]{40}$ ]]; then
              ksu_display+="📌 \`$ksu_type\`, \`$ksu_ref\`"
            else
              ksu_display+="🔀 \`$ksu_type\`, \`$ksu_ref\` (\`${{ steps.set-matrix.outputs.ksu_resolved_hash }}\`)"
            fi
          fi
          
          build_ts_input="${{ inputs.build_timestamp }}"
          if [ -z "$build_ts_input" ]; then
            build_ts_display="⏱️ auto (current build time)"
          else
            build_ts_display="📌 \`$build_ts_input\`"
          fi
          
          {
            cat << 'EOF'
          ## 🎯 Build Plan
          
          **Target:** OP13 / ColorOS 17 / oneplus_13_w.xml
          **Devices:** ${{ steps.set-matrix.outputs.count }}  
          
          **Configuration:**
          EOF
          
            echo "- KSU Config: $ksu_display"
            echo "- Build Timestamp: $build_ts_display"
          
            cat << 'EOF'
          - Optimization: ${{ inputs.optimize_level }}
          - MLGO: ${{ inputs.mlgo }}
          - Clean Build/No Ccache: ${{ inputs.clean_build && '✅ Yes' || '❌ No' }}
          - Create Release: ${{ inputs.make_release && '✅ Yes' || '❌ No' }}
          - Create Debug Artifacts: ${{ inputs.debug && '✅ Yes' || '❌ No' }}
          - Sync toolchains: ${{ inputs.mirror_toolchains && '✅ Yes' || '❌ No' }}
          
          **SUSFS Configuration:**
          EOF
          } >> "$GITHUB_STEP_SUMMARY"
          
          # Display SUSFS config for each kernel version
          declare -A susfs_inputs=(
            ["android15-6.6"]="${{ inputs.android15-6_6_susfs_branch_or_commit }}"
          )
          
          declare -A step_hashes=(
            ["android15-6.6"]="${{ steps.set-matrix.outputs.susfs_hash_android15_6_6 }}"
          )
          
          # Iterate only on the GKI versions present in this run
          IFS=',' read -ra active_keys_display \
            <<< "${{ steps.set-matrix.outputs.active_gki_keys }}"
          
          for key in "${active_keys_display[@]}"; do
            value="${susfs_inputs[$key]:-}"
            fetched_hash="${step_hashes[$key]:-unknown}"
            
            if [ -z "$value" ]; then
              # Auto: no input > hash resolved by ls-remote
              echo "- $key: 🔄 auto (\`$fetched_hash\`)" >> $GITHUB_STEP_SUMMARY
            elif [[ "$value" =~ ^[0-9a-f]{40}$ ]]; then
              # Manual 40-char hash > direct passthrough
              echo "- $key: 📌 \`$value\`" >> $GITHUB_STEP_SUMMARY
            else
              # Branch name > show branch + resolved hash
              echo "- $key: 🔀 \`$value\` (\`$fetched_hash\`)" >> $GITHUB_STEP_SUMMARY
            fi
          done
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> **💡 Note:** Hashes are resolved at run time via API calls before builds start." >> $GITHUB_STEP_SUMMARY
          

  mirror_toolchain:
    needs: set-op-model
    if: ${{ inputs.mirror_toolchains }}
    uses: ./.github/workflows/mirror-toolchains.yml
    secrets: inherit

  prepare_ccache:
    name: Prepare ccache binary (download once)
    runs-on: ubuntu-24.04
    steps:
      # Download the custom ccache binary ONCE for the whole matrix and share it as
      # an artifact. Previously every parallel matrix job curl'd the same GitHub raw
      # URL simultaneously, which made GitHub's edge rate-limit / 504 the CI IPs and
      # fail the whole build (the URL is fine in a browser -- it's the ~30x parallel
      # hammering that triggers the throttle).
      - name: Download custom ccache once
        run: |
          set -uo pipefail
          echo "::group::Download ccache"
          url="https://raw.githubusercontent.com/WildKernels/kernel_patches/refs/heads/main/ccache/ccache-x86-64"
          ok=0
          for attempt in 1 2 3 4 5 6; do
            if curl -LfsS --connect-timeout 30 --max-time 120 -H "User-Agent: Mozilla/5.0" "$url" -o ccache && [ -s ccache ]; then
              ok=1; break
            fi
            echo "attempt $attempt failed (GitHub raw 504/throttle); backing off..."
            sleep $(( attempt * 5 + RANDOM % 6 ))
          done
          if [ "$ok" = 1 ]; then
            chmod +x ccache
            echo "✅ downloaded ccache once for all matrix jobs"
          else
            echo "::warning::custom ccache download failed; matrix jobs will fall back to the apt ccache"
            rm -f ccache
          fi
          echo "::endgroup::"
      - name: Upload ccache artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ccache-binary
          path: ccache
          retention-days: 1
          if-no-files-found: warn

  prepare_susfs:
    name: Prepare SUSFS archives (download once)
    needs: set-op-model
    if: ${{ needs.set-op-model.outputs.active_gki_keys != '' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Download active SUSFS archives once
        env:
          ACTIVE_GKI_KEYS: ${{ needs.set-op-model.outputs.active_gki_keys }}
          SUSFS_HASH_ANDROID15_6_6: ${{ needs.set-op-model.outputs.susfs_hash_android15_6_6 }}
        run: |
          set -euo pipefail
          echo "::group::Download shared SUSFS archives"
          mkdir -p susfs-archives

          declare -A hashes=(
            ["android15-6.6"]="$SUSFS_HASH_ANDROID15_6_6"
          )
          declare -A seen=()

          IFS=',' read -ra active_keys <<< "$ACTIVE_GKI_KEYS"
          for key in "${active_keys[@]}"; do
            ref="${hashes[$key]:-unknown}"
            if [[ ! "$ref" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::Invalid resolved SUSFS hash '$ref' for $key"
              exit 1
            fi

            if [[ -n "${seen[$ref]:-}" ]]; then
              echo "ℹ️  $key reuses SUSFS $ref; skipping duplicate download"
              continue
            fi
            seen[$ref]=1

            archive="susfs-archives/susfs4ksu-${ref}.tar.gz"
            tmp="${archive}.part"
            url="https://gitlab.com/api/v4/projects/simonpunk%2Fsusfs4ksu/repository/archive.tar.gz?sha=${ref}&include_lfs_blobs=false"
            ok=0

            for attempt in 1 2 3 4 5 6; do
              rm -f "$tmp"
              if curl -LfsS --connect-timeout 30 --max-time 180 \
                -H "User-Agent: Mozilla/5.0" "$url" -o "$tmp" \
                && [ -s "$tmp" ] \
                && tar -tzf "$tmp" >/dev/null 2>&1; then
                mv "$tmp" "$archive"
                ok=1
                echo "✅ Downloaded $key SUSFS $ref"
                break
              fi

              echo "::warning::SUSFS download failed for $key (attempt $attempt/6); backing off..."
              sleep $(( attempt * 5 + RANDOM % 6 ))
            done

            if [ "$ok" != 1 ]; then
              rm -f "$tmp"
              echo "::error::Failed to download SUSFS archive for $key ($ref)"
              exit 1
            fi
          done

          echo "Prepared $(find susfs-archives -maxdepth 1 -name 'susfs4ksu-*.tar.gz' -type f | wc -l) unique SUSFS archive(s)"
          echo "::endgroup::"

      - name: Upload shared SUSFS archives
        uses: actions/upload-artifact@v7.0.2
        with:
          name: susfs-archives
          path: susfs-archives/*.tar.gz
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

  build:
    name: build (${{ matrix.model }}, ${{ matrix.soc }}, ${{ matrix.branch }}, ${{ matrix.manifest }}, ${{ matrix.android_version }}, ${{ matrix.kernel_version }}, ${{ matrix.os_version }}, ${{ matrix.ksu_type }})
    needs: [set-op-model, mirror_toolchain, prepare_ccache, prepare_susfs]
    if: |
      !cancelled() &&
      needs.set-op-model.result == 'success' &&
      (needs.mirror_toolchain.result == 'success' || needs.mirror_toolchain.result == 'skipped') &&
      (needs.prepare_susfs.result == 'success' || needs.prepare_susfs.result == 'skipped')
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.set-op-model.outputs.matrix) }}
    outputs:
      ksu_ver: ${{ steps.build-stat.outputs.ksu_version }}
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1

      - name: 🧹 Emergency Disk Cleanup
        if: ${{ matrix.disk_cleanup }}
        uses: ./.github/actions/disk-cleanup

      - name: Install Minimal Dependencies
        run: |
          set -euo pipefail
          echo "::group::Install dependencies"
          sudo apt-get -o Acquire::Retries=3 update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            git curl ca-certificates build-essential clang lld flex bison \
            libelf-dev libssl-dev libncurses-dev zlib1g-dev liblz4-tool \
            libxml2-utils rsync unzip dwarves file python3 ccache jq bc dos2unix kmod libdw-dev elfutils pigz
          sudo apt-get clean
          echo "✅ Dependencies installed"
          echo "::endgroup::"

      - name: Get prebuilt ccache (downloaded once by prepare_ccache)
        uses: actions/download-artifact@v8.0.2
        with:
          name: ccache-binary
          path: ccache-dl
        continue-on-error: true

      - name: Install ccache (ECS by cctv18, shared via artifact)
        run: |
          set -uo pipefail
          echo "::group::Install ccache"
          if [ -s ccache-dl/ccache ]; then
            sudo cp -f ccache-dl/ccache /usr/bin/ccache
            sudo chmod +x /usr/bin/ccache
            echo "✅ installed custom ccache from shared artifact"
          else
            # prepare_ccache could not fetch it (504/throttle); keep the apt ccache
            # already installed in 'Install Minimal Dependencies'.
            echo "::warning::shared ccache artifact unavailable; using apt ccache"
          fi
          rm -rf ccache-dl
          echo "[DEBUG] Ccache version : $(ccache --version | head -1)"
          echo "::endgroup::"

      - name: Get shared SUSFS archives
        if: ${{ matrix.susfs }}
        uses: actions/download-artifact@v8.0.2
        with:
          name: susfs-archives
          path: susfs-archives

      - name: Route SUSFS fetches to shared archive
        if: ${{ matrix.susfs }}
        shell: bash
        run: |
          set -euo pipefail
          chmod +x "$GITHUB_WORKSPACE/.github/scripts/susfs-archive-bin/aria2c"
          echo "$GITHUB_WORKSPACE/.github/scripts/susfs-archive-bin" >> "$GITHUB_PATH"
          echo "✅ SUSFS archive shim enabled for this matrix job"

      - name: ♻️ Configure ccache (bounded)
        run: |
          echo "::group::Configure ccache environment"
          set -euo pipefail
          if command -v ccache >/dev/null 2>&1; then
            CACHE_DIR="${{ github.workspace }}/.ccache"
            CCACHE_LOG="${{ github.workspace }}/ccache.log"
            mkdir -p "$CACHE_DIR"
            
            SETTINGS=(
              "CCACHE_DIR=$CACHE_DIR"
              "CCACHE_MAXSIZE=12G"
              "CCACHE_COMPILERCHECK=content"
              "CCACHE_BASEDIR=${GITHUB_WORKSPACE}"
              "CCACHE_NOHASHDIR=true"
              "CCACHE_IGNOREOPTIONS=--sysroot*"
              "CCACHE_COMPRESSION=true"
              "CCACHE_COMPRESSION_LEVEL=3"
              "CCACHE_DIRECT=true"
              "CCACHE_FILE_CLONE=true"
              "CCACHE_INODE_CACHE=true"
              "CCACHE_IS_KERNEL_COMPILING=true"
              "CCACHE_UMASK=002"
              "CCACHE_LOGFILE=${CCACHE_LOG}"
              "CCACHE_SLOPPINESS=file_macro,time_macros,include_file_mtime,include_file_ctime,pch_defines,system_headers,locale"
            )
            
            for setting in "${SETTINGS[@]}"; do
              export "$setting"
              echo "$setting" >> "$GITHUB_ENV"
            done
            
            if ccache --help 2>&1 | grep -q 'depend_mode'; then
              export CCACHE_DEPEND=true
              echo "CCACHE_DEPEND=true" >> "$GITHUB_ENV"
            fi
            
            echo "✅ ccache configured successfully"
            echo "Current ccache configuration:"
            ccache -p
          else
            echo "ccache not found, skipping configuration."
          fi
          echo "::endgroup::"

      - name: 🧹 Prepare op_config_json (without KSU fields)
        id: prepare_config
        shell: bash
        run: |
          echo "config_json=$(jq -nc --argjson m '${{ toJSON(matrix) }}' '$m | del(.ksu_type, .ksu_hash, .ksu_resolved_hash)')" >> "$GITHUB_OUTPUT"

      - name: 🔨 Build Kernel
        id: build
        uses: ./.github/actions/build-kernel
        with:
          op_config_json: ${{ steps.prepare_config.outputs.config_json }}
          ksu_type: ${{ matrix.ksu_type }}
          ksu_branch_or_hash: ${{ matrix.ksu_resolved_hash }}
          susfs_commit_hash_or_branch: ${{ matrix.susfs_resolved_hash }}
          optimize_level: ${{ inputs.optimize_level }}
          mlgo: ${{ inputs.mlgo }}
          build_timestamp: ${{ inputs.build_timestamp }}
          clean: ${{ inputs.clean_build }}
          debug: ${{ inputs.debug }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: 📊 Build statistics
        id: build-stat
        if: always()
        run: |
          echo "::group::Build Statistics"
          
          echo "Device: ${{ matrix.model }}"
          echo "OS Version: ${{ matrix.os_version }}"
          echo "Kernel: ${{ matrix.android_version }}-${{ matrix.kernel_version }}"
          if [ "${{ matrix.susfs }}" = true ]; then
            echo "SUSFS Hash: ${{ matrix.susfs_resolved_hash }}"
          fi
          echo "Status: ${{ job.status }}"
          
          if [ "${{ steps.build.outcome }}" = "success" ]; then
            echo ""
            echo "✅ Build completed successfully"
            echo ""
            echo "Outputs:"
            echo "  - Kernel: ${{ steps.build.outputs.kernel_version }}"
            if [ "${{ matrix.ksu_type }}" = "BakaSU" ]; then
              echo "  - BakaSU: v${{ steps.build.outputs.ksu_version }}"
            else
              echo "  - KSU: v${{ steps.build.outputs.ksu_version }}"
            fi
            
            echo "ksu_ver=${{ steps.build.outputs.ksu_version }}" >> "$GITHUB_OUTPUT"
            
            if [ "${{ matrix.susfs }}" = true ]; then
              echo "  - SUSFS: ${{ steps.build.outputs.susfs_version }}"
            fi
            echo "  - Build time: ${{ steps.build.outputs.build_time }}s"
            
            if [ "${{ inputs.clean_build }}" != "true" ]; then
              echo "  - ccache hit rate: ${{ steps.build.outputs.ccache_hit_rate }}"
              echo "  - ccache direct rate: ${{ steps.build.outputs.ccache_direct_rate }}"
            else
              echo "  - ccache: disabled (clean build)"
            fi
            
            if [ -n "${{ steps.build.outputs.warnings }}" ]; then
              echo "  - Warnings: ${{ steps.build.outputs.warnings }}"
            fi
          else
            echo "❌ Build failed"
          fi
          
          echo "::endgroup::"

      - name: 📝 Job summary
        if: always()
        run: |
          cat >> $GITHUB_STEP_SUMMARY << EOF
          
          ### ${{ matrix.model }} (${{ matrix.os_version }}) - ${{ job.status == 'success' && '✅ Success' || '❌ Failed' }}
          
          **Kernel:** ${{ matrix.android_version }}-${{ matrix.kernel_version }}
          EOF
          
          if [ "${{ matrix.susfs }}" = true ]; then
            cat >> $GITHUB_STEP_SUMMARY << EOF
          **SUSFS Hash:** \`${{ matrix.susfs_resolved_hash }}\`
          EOF
          fi
          
          if [ "${{ steps.build.outcome }}" = "success" ]; then
            cat >> $GITHUB_STEP_SUMMARY << EOF
          | Metric | Value |
          |--------|-------|
          | **Kernel** | ${{ steps.build.outputs.kernel_version }} |
          EOF
            if [ "${{ matrix.ksu_type }}" = "BakaSU" ]; then
              cat >> $GITHUB_STEP_SUMMARY << EOF
          | **BakaSU** | v${{ steps.build.outputs.ksu_version }} |
          EOF
            else
              cat >> $GITHUB_STEP_SUMMARY << EOF
          | **KSU** | v${{ steps.build.outputs.ksu_version }} |
          EOF
            fi
            
            if [ "${{ matrix.susfs }}" = true ]; then
              cat >> $GITHUB_STEP_SUMMARY << EOF
          | **SUSFS** | ${{ steps.build.outputs.susfs_version }} |
          EOF
            fi
          cat >> $GITHUB_STEP_SUMMARY << EOF
          | **Build Time** | ${{ steps.build.outputs.build_time }}s |
          EOF
            
            if [ "${{ inputs.clean_build }}" != "true" ]; then
              cat >> $GITHUB_STEP_SUMMARY << EOF
          | **ccache Hit Rate** | ${{ steps.build.outputs.ccache_hit_rate }} |
          | **ccache Direct Rate** | ${{ steps.build.outputs.ccache_direct_rate }} |
          EOF
            fi
            
            if [ -n "${{ steps.build.outputs.warnings }}" ]; then
              echo "| **Warnings** | ${{ steps.build.outputs.warnings }} |" >> $GITHUB_STEP_SUMMARY
            fi
            
            cat >> $GITHUB_STEP_SUMMARY << EOF
          
          **Image SHA256:** \`${{ steps.build.outputs.image_sha256 }}\`
          **AnyKernel3 Zip SHA256:** \`${{ steps.build.outputs.zip_sha256 }}\`
          EOF
          fi

      - name: 🧹 Final cleanup and space report
        if: always()
        run: |
          echo "::group::Cleanup"
          
          # Remove build artifacts but PRESERVE ccache
          sudo rm -rf "$GITHUB_WORKSPACE/out" || true
          sudo rm -rf "$GITHUB_WORKSPACE/build" || true
          sudo rm -rf "$GITHUB_WORKSPACE/kernel/out" || true
          sudo rm -rf "$GITHUB_WORKSPACE/.repo" || true
          sudo rm -rf /tmp/* || true
          
          # Show ccache stats (don't clear it!)
          if command -v ccache >/dev/null 2>&1; then
            echo ""
            echo "📊 ccache statistics after build:"
            ccache -s
            echo ""
            echo "💾 ccache preserved for next build"
          fi
          
          echo ""
          echo "💽 Final disk usage:"
          df -h /
          
          echo "::endgroup::"

  trigger-release:
    needs: [set-op-model, build]
    runs-on: ubuntu-24.04
    if: |
      !cancelled() &&
      inputs.make_release == true &&
      needs.build.result == 'success' &&
      needs.set-op-model.result == 'success'
    env:
      REPO_OWNER: ${{ github.repository_owner }}
      REPO_NAME: ${{ github.event.repository.name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SUSFS_BASE_VERSION: ${{ needs.set-op-model.outputs.susfs_base_version }}
      RELEASE_NAME: 'OnePlus 13 ColorOS 17 · USB WiFi · ${{ inputs.ksu_type }} & SUSFS ${{ needs.set-op-model.outputs.susfs_base_version }}'
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: 📥 Download build matrix
        uses: actions/download-artifact@v8.0.2
        with:
          name: matrix.json
          path: ./downloaded-artifacts
          skip-decompress: true

      - name: 📥 Download kernel ZIPs
        uses: actions/download-artifact@v8.0.2
        with:
          pattern: 'AK3_*_USBWiFi.zip'
          path: ./downloaded-artifacts
          merge-multiple: true
          skip-decompress: true

      - name: Validate complete release asset set
        run: |
          python3 scripts/validate_release_assets.py \
            --directory ./downloaded-artifacts \
            --expected "${{ needs.set-op-model.outputs.device_count }}"

      - name: Publish the validated ColorOS 17 kernel
        env:
          ROOT_TYPE: ${{ inputs.ksu_type }}
          ROOT_SHA: ${{ needs.set-op-model.outputs.ksu_resolved_hash }}
          SUSFS_SHA: ${{ needs.set-op-model.outputs.susfs_hash_android15_6_6 }}
          OPTIMIZE_LEVEL: ${{ inputs.optimize_level }}
          MLGO: ${{ inputs.mlgo }}
        run: |
          set -euo pipefail
          tag="usb-wifi-${SUSFS_BASE_VERSION}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "NEW_TAG=$tag" >> "$GITHUB_ENV"
          archives=(downloaded-artifacts/AK3_OP13_COS17_*_USBWiFi.zip)
          archive=${archives[0]}
          filename=$(basename "$archive")
          root_version=$(cut -d_ -f6 <<< "$filename")
          digest=$(sha256sum "$archive" | cut -d' ' -f1)
          image_digest=$(unzip -p "$archive" Image | sha256sum | cut -d' ' -f1)
          hybrid=$(unzip -p "$archive" hybridmount-support/manifest.json | jq -er '.revision')
          root_repo=Baka-SU/BakaSU
          if [[ "$ROOT_TYPE" == KSU ]]; then root_repo=tiann/KernelSU; fi
          download="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$tag/$filename"
          cat > release_notes.md <<EOF
          适用于一加 13（PJZ110）的 ColorOS 17.0.1.202(CN01)，内核为 android15-6.6.118。使用 OnePlusOSS 公开的 OP13 源码基线。C17 真机启动、板载 WiFi 和 USB 网卡仍待验证。

          | 机型 / 刷机包 | 系统 | Root | SUSFS |
          | --- | --- | --- | --- |
          | [OnePlus 13]($download) | ColorOS 17 | $ROOT_TYPE $root_version | $SUSFS_BASE_VERSION |

          构建检查覆盖内建 USB Wi-Fi 驱动、Image 中的固件、66 项原厂模块 ABI CRC 和 Hybrid Mount VFS 链接。ZIP 内附详细报告。

          | 构建来源 | 版本 |
          | --- | --- |
          | [$ROOT_TYPE](https://github.com/$root_repo/commit/$ROOT_SHA) | \`$ROOT_SHA\` |
          | [SUSFS](https://gitlab.com/simonpunk/susfs4ksu/-/commit/$SUSFS_SHA) | \`$SUSFS_SHA\` |
          | [Hybrid Mount](https://github.com/Hybrid-Mount/meta-hybrid_mount/commit/$hybrid) | \`$hybrid\` |
          | Clang 编译选项 | $OPTIMIZE_LEVEL，MLGO 请求值 $MLGO |

          **ZIP SHA-256** \`$digest\`

          **Image SHA-256** \`$image_digest\`

          [完整构建记录]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID) · [刷入说明及适配范围]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/blob/$GITHUB_SHA/docs/cos17.md)
          EOF
          gh release create "$tag" "$archive" --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --title "$RELEASE_NAME" --notes-file release_notes.md \
            --prerelease --latest=false

      - name: 📊 Release summary
        if: success()
        run: |
          cat >> $GITHUB_STEP_SUMMARY << EOF
          
          ---
          
          ## 🎉 Release Created Successfully
          
          **Tag:** [\`${{ env.NEW_TAG }}\`](${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ env.NEW_TAG }})  
          **Kernels:** $(find ./downloaded-artifacts -maxdepth 1 -name "*.zip" -type f | wc -l)
          
          ### 📦 Assets
          EOF
          
          for zip in ./downloaded-artifacts/*.zip; do
            if [ -f "$zip" ]; then
              name=$(basename "$zip")
              size=$(stat -c%s "$zip")
              size_mb=$(echo "scale=2; $size / 1024 / 1024" | bc)
              echo "- \`$name\` (${size_mb} MB)" >> $GITHUB_STEP_SUMMARY
            fi
          done

      - name: 📱 Send Detailed Telegram Notification
        if: success()
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          set -euo pipefail
          echo "::group::Telegram Notification"
          
          if [ -z "$TG_BOT_TOKEN" ] || [ -z "$TG_CHAT_ID" ]; then
            echo "⚠️ Telegram secrets not configured. Skipping notification."
            exit 0
          fi
          
          echo "Aggregating artifact statistics..."
          
          # Safely read all zip files into an array
          shopt -s nullglob
          ZIPS=(./downloaded-artifacts/*.zip)
          shopt -u nullglob
          
          ZIP_COUNT=${#ZIPS[@]}
          
          if [ "$ZIP_COUNT" -eq 0 ]; then
            MODELS="None"
            OS_VERS="None"
            KSU_VERS="Unknown"
          else
            # Extract models (2nd part), OS versions (3rd part), and KSU versions (6th part) from AK3_OP13_COS17_android15-6.6_BakaSU_30700...zip
            MODELS=$(printf "%s\n" "${ZIPS[@]}" | awk -F'/' '{print $NF}' | awk -F'_' '{print $2}' | sort -u | paste -sd ", " -)
            OS_VERS=$(printf "%s\n" "${ZIPS[@]}" | awk -F'/' '{print $NF}' | awk -F'_' '{print $3}' | sort -u | paste -sd ", " -)
            KSU_VERS=$(printf "%s\n" "${ZIPS[@]}" | awk -F'/' '{print $NF}' | awk -F'_' '{print $6}' | sort -u | paste -sd ", " -)
          fi
          
          echo "Found $ZIP_COUNT packages for models: $MODELS, KSU Ver: $KSU_VERS"
          
          # Use pure Bash multi-line string. True newlines are preserved!
          MSG_TEXT="🚀 <b>OnePlus Kernel Build Successful!</b>
          ━━━━━━━━━━━━━━━━━━
          <b>🏷️ Release Tag:</b> <code>${{ env.NEW_TAG }}</code>
          <b>🔐 Root Solution:</b> ${{ inputs.ksu_type }} (v${KSU_VERS})
          <b>🛡️ SUSFS Version:</b> ${{ env.SUSFS_BASE_VERSION }}
          <b>⚙️ Optimization:</b> ${{ inputs.optimize_level }} | Clean: ${{ inputs.clean_build }}
          ━━━━━━━━━━━━━━━━━━
          <b>📦 Total Packages:</b> ${ZIP_COUNT} zips
          <b>📱 Supported Models:</b> ${MODELS}
          <b>💻 Supported OS:</b> ${OS_VERS}
          
          ━━━━━━━━━━━━━━━━━━
          👉 <a href=\"${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ env.NEW_TAG }}\"><b>📥 GET YOUR KERNEL HERE</b></a>
          📢 <a href=\"https://t.me/huangdihd_wildkernel\"><b>JOIN TELEGRAM CHANNEL</b></a>"
          
          # Split TG_CHAT_ID by comma or space
          IFS=' ,' read -r -a CHAT_IDS <<< "$TG_CHAT_ID"
          
          for ID in "${CHAT_IDS[@]}"; do
            if [ -z "$ID" ]; then continue; fi
            echo "Constructing secure JSON payload for Chat ID: $ID..."
            
            # jq automatically escapes the true newlines and HTML characters into a safe JSON string
            PAYLOAD=$(jq -n \
              --arg chat_id "$ID" \
              --arg text "$MSG_TEXT" \
              '{
                chat_id: $chat_id,
                parse_mode: "HTML",
                disable_web_page_preview: true,
                text: $text
              }')
            
            echo "Sending POST request to Telegram API (Chat ID: $ID)..."
            
            # Send payload as application/json
            RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
              -H "Content-Type: application/json" \
              -d "$PAYLOAD")
            
            HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
            RESPONSE_BODY=$(echo "$RESPONSE" | head -n -1)

            if [ "$HTTP_CODE" -eq 200 ]; then
              echo "✅ Detailed Telegram notification sent successfully to $ID! response: $RESPONSE_BODY"
            else
              echo "❌ Failed to send Telegram notification to $ID! status code: $HTTP_CODE, response: $RESPONSE_BODY"
              # We don't necessarily want to exit if one ID fails, but we should log it.
              # However, if it's the only ID, maybe we should? Let's keep it robust.
            fi
          done
          echo "::endgroup::"
