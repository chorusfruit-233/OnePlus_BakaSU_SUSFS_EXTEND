name: Validate built-in USB WiFi and NoMount integration
on:
  push:
    branches: [main]
    paths: ['scripts/**', 'profiles/**', 'tests/**', 'configs/**', 'manifests/**', '.github/actions/build-kernel/**', '.github/workflows/build-kernel-release.yml', '.github/workflows/mirror-toolchains.yml', '.github/workflows/test-usb-wifi.yml', 'README.md', 'compatibility.md']
  pull_request:
    paths: ['scripts/**', 'profiles/**', 'tests/**', 'configs/**', 'manifests/**', '.github/actions/build-kernel/**', '.github/workflows/build-kernel-release.yml', '.github/workflows/mirror-toolchains.yml', '.github/workflows/test-usb-wifi.yml', 'README.md', 'compatibility.md']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install Kconfig dependency resolver
        run: python3 -m pip install --disable-pip-version-check -r scripts/requirements-usb-wifi.txt
      - run: python3 -m unittest discover -s tests -v
