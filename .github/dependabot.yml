version: 2
updates:
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/build-kernel
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      official-actions:
        patterns:
          - actions/*

  - package-ecosystem: pip
    directory: /scripts
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
